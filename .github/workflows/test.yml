name: Test CLI

on:
  workflow_call:
    inputs:
      sdk-version:
        description: "Dart SDK version"
        type: string
        required: false
        default: "3.13.0"

  pull_request:
    paths-ignore:
      - "docs/**"
      - "README.md"
      - "CHANGELOG.md"
      - "**/*.md"
      - "**/LICENSE"
      - ".gitignore"
      - "docs/public/install.sh"
      - "docs/public/uninstall.sh"
      - "scripts/install.ps1"
      - "scripts/test-install-arch.sh"
      - "scripts/test-install.sh"
      - ".github/workflows/test-install.yml"

  push:
    branches: [ main, develop ]
    paths-ignore:
      - "docs/**"
      - "README.md"
      - "CHANGELOG.md"
      - "**/*.md"
      - "**/LICENSE"
      - ".gitignore"
      - "docs/public/install.sh"
      - "docs/public/uninstall.sh"
      - "scripts/install.ps1"
      - "scripts/test-install-arch.sh"
      - "scripts/test-install.sh"
      - ".github/workflows/test-install.yml"

  workflow_dispatch:

env:
  SDK_VERSION: "3.13.0"
  RELEASE_DART_SDK: "3.13.0"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  minimum-sdk:
    name: Minimum SDK (${{ matrix.package }})
    timeout-minutes: 30
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: fvm
            directory: .
            sdk: "3.6.0"
          - package: fvm_mcp
            directory: fvm_mcp
            sdk: "3.9.0"
          - package: release tool
            directory: tool/release_tool
            sdk: "3.8.0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup minimum Dart SDK
        uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ matrix.sdk }}

      - name: Install dependencies
        working-directory: ${{ matrix.directory }}
        run: dart pub get

      - name: Analyze
        working-directory: ${{ matrix.directory }}
        run: dart analyze --fatal-infos

      - name: Test
        working-directory: ${{ matrix.directory }}
        run: dart test

  downgraded-dependencies:
    name: Downgraded dependencies on minimum SDK
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: "3.6.0"

      - name: Resolve minimum dependency versions
        run: dart pub downgrade

      - name: Analyze
        run: dart analyze --fatal-infos

      - name: Test
        run: dart test

  chocolatey-package:
    name: Chocolatey package
    timeout-minutes: 30
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare environment
        uses: ./.github/actions/prepare
        with:
          sdk-version: ${{ env.RELEASE_DART_SDK }}

      - name: Install release tool dependencies
        working-directory: tool/release_tool
        run: dart pub get --enforce-lockfile

      - name: Build Windows x64 release archive
        working-directory: tool/release_tool
        run: dart run grinder pkg-standalone-windows-x64

      - name: Build Chocolatey package
        working-directory: tool/release_tool
        run: dart run grinder fvm-chocolatey-pack

      - name: Verify Chocolatey install and shim
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $versionLine = Select-String -Path pubspec.yaml -Pattern '^version:'
          $version = ($versionLine.Line -split ':', 2)[1].Trim()

          try {
            choco install fvm --version $version --source "${{ github.workspace }}\build" --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw "choco install failed" }

            $actualVersion = (fvm --version).Trim()
            if ($actualVersion -ne $version) {
              throw "Expected FVM $version, got $actualVersion"
            }

            $installedNuspec = Join-Path $env:ChocolateyInstall 'lib\fvm\fvm.nuspec'
            if (Select-String -Path $installedNuspec -Pattern 'dart-sdk' -Quiet) {
              throw 'Chocolatey package unexpectedly depends on dart-sdk'
            }

            if (-not (Get-Command fvm -ErrorAction SilentlyContinue)) {
              throw 'Chocolatey did not create the fvm command shim'
            }
          } finally {
            choco uninstall fvm --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw "choco uninstall failed" }
          }

          if (Get-Command fvm -ErrorAction SilentlyContinue) {
            throw 'Chocolatey did not remove the fvm command shim'
          }

  # ─────────────────────────────────────────────────────────────────────────────
  # Unit Tests - Run first for fast feedback
  # ─────────────────────────────────────────────────────────────────────────────
  test:
    name: Test
    timeout-minutes: 30
    runs-on: ubuntu-latest
    env:
      DCM_CI_KEY: ${{ secrets.DCM_CI_KEY }}
      DCM_EMAIL: ${{ secrets.DCM_EMAIL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare environment
        uses: ./.github/actions/prepare
        with:
          sdk-version: ${{ (github.event_name == 'workflow_call' && inputs.sdk-version) || env.SDK_VERSION }}

      - name: fvm_mcp | Install dependencies
        working-directory: fvm_mcp
        run: dart pub get

      - uses: invertase/github-action-dart-analyzer@v1
        with:
          fatal-infos: false

      # DCM >=1.38.2 refuses to run on CI without a license (DCM_CI_KEY and
      # DCM_EMAIL). Skip the steps when the repo has no license secrets; the
      # husky pre-commit/pre-push hooks still run a licensed `dcm analyze lib`
      # locally. Adding the secrets re-enables DCM here automatically.
      - name: Install DCM
        if: env.DCM_CI_KEY != '' && env.DCM_EMAIL != ''
        uses: CQLabs/setup-dcm@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run DCM
        if: env.DCM_CI_KEY != '' && env.DCM_EMAIL != ''
        run: dcm analyze lib fvm_mcp/lib
      
      - name: Install lcov
        run: sudo apt-get install lcov

      - name: Run tests (root)
        uses: ./.github/actions/test
        with:
          with-coverage: 'true'

      - name: fvm_mcp | Format check
        working-directory: fvm_mcp
        run: dart format --output=none --set-exit-if-changed .

      - name: fvm_mcp | Analyze
        working-directory: fvm_mcp
        run: dart analyze

      - name: fvm_mcp | Tests
        working-directory: fvm_mcp
        run: dart test

      - name: Clean Dart SDK temp files
        run: rm -f ${{ runner.temp }}/dartsdk-*.zip

      - name: Setup Dart (release tool)
        uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ env.RELEASE_DART_SDK }}

      - name: Release tool | Install dependencies
        working-directory: tool/release_tool
        run: dart pub get --enforce-lockfile

      - name: Release tool | Analyze
        working-directory: tool/release_tool
        run: dart analyze

      - name: Release tool | Tests
        working-directory: tool/release_tool
        run: dart test

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v4
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}


  test-os:
    name: Test on ${{ matrix.os }}
    timeout-minutes: 45
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [macos-latest, windows-latest]

    steps:        
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare environment
        uses: ./.github/actions/prepare
        with:
          sdk-version: ${{ (github.event_name == 'workflow_call' && inputs.sdk-version) || env.SDK_VERSION }}

      - name: fvm_mcp | Install dependencies
        working-directory: fvm_mcp
        run: dart pub get
        shell: bash

      - name: Tests
        uses: ./.github/actions/test

      - name: fvm_mcp | Analyze
        working-directory: fvm_mcp
        run: dart analyze
        shell: bash

      - name: fvm_mcp | Tests
        working-directory: fvm_mcp
        run: dart test
        shell: bash

  # ─────────────────────────────────────────────────────────────────────────────
  # Integration Tests - Run in parallel with unit tests
  # ─────────────────────────────────────────────────────────────────────────────
  integration-test:
    name: Integration Tests on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs: [test, test-os]
    timeout-minutes: 45
    # Skip heavy integration tests for the fvm-mcp PR branch (MCP-only changes).
    if: github.event_name != 'pull_request' || github.event.pull_request.head.ref != 'fvm-mcp'

    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ (github.event_name == 'workflow_call' && inputs.sdk-version) || env.SDK_VERSION }}

      - name: Install dependencies
        run: dart pub get

      - name: Setup Git (required for FVM operations)
        run: |
          git config --global user.name "FVM Integration Test"
          git config --global user.email "test@fvm.app"

      - name: Run Integration Tests
        shell: bash
        run: dart run grinder integration-test

  migration-test:
    name: Migration Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install dependencies
        run: dart pub get

      - name: Setup Git (required for FVM operations)
        run: |
          git config --global user.name "FVM Integration Test"
          git config --global user.email "test@fvm.app"

      - name: Migration from v3 integration test
        env:
          RUN_MIGRATION_IT: "true"
        run: dart test test/integration/migration_from_v3_test.dart
